name: Web CI/CD

on:
  push:
    branches: [ main ]

permissions:
  contents: write   # GitOps: el deploy commitea el tag sha en k8s/deployment.yaml
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NAMESPACE: mindtechpy-web

jobs:
  build-and-deploy:
    runs-on: self-hosted
    name: Build and Deploy Website
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,format=short
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

    - name: Ensure namespace exists
      run: |
        kubectl apply -f k8s/namespace.yaml

    - name: Create/Update SMTP secret
      run: |
        kubectl create secret generic smtp-secret \
          --from-literal=SMTP_HOST=${{ secrets.SMTP_HOST }} \
          --from-literal=SMTP_PORT=${{ secrets.SMTP_PORT }} \
          --from-literal=SMTP_USER=${{ secrets.SMTP_USER }} \
          --from-literal=SMTP_PASS=${{ secrets.SMTP_PASS }} \
          --from-literal=MAIL_TO=${{ secrets.MAIL_TO }} \
          --namespace=${{ env.NAMESPACE }} \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Pin image tag + commit (GitOps → Argo sincroniza el rollout)
      run: |
        IMAGE_TAG="sha-$(echo $GITHUB_SHA | cut -c1-7)"
        sed -i "s#\(image: ghcr.io/poravv/mindtechpy-website:\).*#\1${IMAGE_TAG}#" k8s/deployment.yaml
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add k8s/deployment.yaml
        git commit -m "chore(deploy): mindtechpy-web ${IMAGE_TAG} [skip ci]" || { echo "sin cambios de imagen"; exit 0; }
        for i in 1 2 3 4 5; do
          git push origin HEAD:main && exit 0
          git fetch origin main && git rebase origin/main
        done
        echo "push falló tras reintentos"; exit 1
